# Раз в неделю — PR с обновлениями зависимостей; CI проверяет их как любой другой PR.
# minor и patch — одним PR; мажорные смены базовых образов (Java, Node) не предлагает: это решение вместе с pom.xml и CI.
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # Spring Boot и Spring Cloud обновляем вместе: Spring Cloud выпускается под конкретную ветку Boot
    ignore:
      - dependency-name: org.springframework.boot:spring-boot-starter-parent
        update-types: [version-update:semver-minor, version-update:semver-major]
    groups:
      maven-minor:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
